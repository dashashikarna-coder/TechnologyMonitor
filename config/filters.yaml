# Правила строгого отбора. После правки просто перезапустите collect.py — уже собранное переразметится.
#
# Тендер попадает в тему, только если ключевое слово темы есть в НАЗВАНИИ закупки.
# Патент — если слово есть в названии, либо в реферате встречаются хотя бы 2 разных ключевых слова темы.

# Слова из Google-таблицы, которые НЕ используются для отнесения к теме: слишком общие, цепляют лишнее
ignore_keywords:
  - радио
  - radio
  - радиоканал
  - радиопередача
  - материаловедение
  - управление доступом
  - технические средства охраны
  - автономная система
  - autonomous system
  - autonomous systems

# Если в названии тендера есть что-то из этого — тендер отбрасывается (работы и услуги, а не технологии).
# Это регулярные выражения: \w* — любое окончание.
tender_exclude:
  - строительств
  - строительно
  - капитальн\w* ремонт
  - текущ\w* ремонт
  - ремонт\w* (здани|помещени|кровл|фасад)
  - реконструкц
  - проектно-изыскательск
  - проектн\w* документац
  - рабоч\w* документац
  - проектировани
  - техническ\w* обслуживани
  - обслуживани\w* (систем|комплекс|оборудовани|средств)
  - монтаж
  - пусконаладк
  - ограждающ
  - благоустройств
  - эфир
  - вещани
  - телеканал
  - размещени\w* (информационн|видео|аудио|материал)
  - фоторепортаж
  - образовательн\w* услуг
  - повышени\w* квалификации
  - обучени
  - охранн\w* услуг
  - физическ\w* охран
  - ремонтн\w* работ
  - конференц
  - аренд
  - расходн\w* материал
  - эксплуатаци
  - эндопротез
  - изделий медицинского назначения
  - продукт\w* питания
  - construction works
  - building works
  - maintenance
  - training
